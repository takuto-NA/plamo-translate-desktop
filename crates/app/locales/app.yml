  en: Chunk size
  ja: 分割の大きさ
settings.history:
  en: History
  ja: 履歴の量
settings.sync_scroll:
  en: Scroll the source and the translation together
  ja: 原文と訳文を連動してスクロール
settings.browser:
  en: Browser extension
  ja: ブラウザ拡張
settings.browser_not_registered:
  en: Not connected
  ja: 未連携
settings.browser_registered:
  en: Connected
  ja: 連携済み
settings.browser_elsewhere:
  en: "Connected to a copy of the app elsewhere:"
  ja: "別の場所のアプリと連携しています:"
settings.browser_reconnect:
  en: Connect this copy
  ja: このアプリと連携する
settings.browser_no_host:
  en: The browser host (plamo-translate-host) is not next to the app
  ja: ブラウザ用のホスト（plamo-translate-host）がアプリと同じフォルダにありません
settings.browser_register:
  en: Connect
  ja: 連携する
settings.browser_unregister:
  en: Disconnect
  ja: 連携を解除
settings.browser_open_folder:
  en: Open extension folder
  ja: 拡張機能のフォルダを開く
settings.browser_error:
  en: "Could not change the connection: %{message}"
  ja: "連携を変更できませんでした: %{message}"
settings.browser_note:
  en: "Connecting lets the PLaMo Translate extension translate in the browser with the model selected here. To install the extension, open chrome://extensions (or edge://extensions), turn on Developer mode, choose \"Load unpacked\", and select the extension folder. Disconnect removes the registration from the browsers (on Windows, from the registry); do this before deleting the app."
  ja: "連携すると、ブラウザの PLaMo Translate 拡張機能が、ここで選んだモデルで翻訳できるようになります。拡張機能は、chrome://extensions（Edge なら edge://extensions）を開いてデベロッパー モードをオンにし、「パッケージ化されていない拡張機能を読み込む」で拡張機能のフォルダを選ぶと入ります。「連携を解除」を押すと、ブラウザへの登録（Windows ではレジストリの登録）を消します。アプリを削除する前に解除してください。"
settings.sync_scroll_note:
  en: "Scrolling one pane scrolls the other to the same place. Moving the caret in one pane selects the corresponding paragraph in the other."
  ja: "片方をスクロールすると、もう片方も同じ箇所までスクロールします。片方でカーソルを動かすと、もう片方で対応する段落を選択します。"
settings.check_updates:
  en: Check for new versions
  ja: 新しい版を確認する
settings.check_updates_note:
  en: "Asks GitHub at most once a day whether a newer version of the app is out, and shows it in the status bar."
  ja: "アプリの新しい版が出ているかを 1 日に 1 回まで GitHub に問い合わせ、出ていればステータスバーに表示します。"
settings.check_now:
  en: Check now
  ja: 今すぐ確認
settings.version:
  en: "Version %{version}"
  ja: "バージョン %{version}"
settings.update_checking:
  en: Checking…
  ja: 確認しています…
settings.update_latest:
  en: "Up to date (the newest release is %{version})"
  ja: "最新です（公開されている最新版は %{version}）"
settings.update_failed:
  en: "Could not check: %{error}"
  ja: "確認できませんでした: %{error}"
update.available:
  en: "Version %{version} is available"
  ja: "新しい版 %{version} があります"
update.open_page:
  en: Open the release page
  ja: リリースのページを開く
update.title:
  en: "Update to %{version}"
  ja: "%{version} に更新"
update.body:
  en: "Downloads the new version. When it is done, \"Restart to update to %{version}\" in the status bar starts the new version."
  ja: "新しい版をダウンロードします。終わったら、ステータスバーの［再起動して %{version} に更新］を押すと、新しい版になります。"
update.manual:
  en: "This copy was not installed from a release package, so it cannot update itself. Download the new version from the release page."
  ja: "このアプリはリリースのパッケージから入れたものではないため、自動では更新できません。リリースのページから新しい版をダウンロードしてください。"
update.last_failed:
  en: "The last attempt failed: %{error}"
  ja: "前回は失敗しました: %{error}"
update.notes:
  en: See what is new
  ja: 変更点を見る
update.download:
  en: Download and update
  ja: ダウンロードして更新
update.later:
  en: Later
  ja: あとで
update.downloading:
  en: "Downloading %{version}… %{percent}%"
  ja: "%{version} をダウンロードしています… %{percent}%"
update.restart:
  en: "Restart to update to %{version}"
  ja: "再起動して %{version} に更新"
update.failed:
  en: "Could not update to %{version}"
  ja: "%{version} に更新できませんでした"
settings.tokens:
  en: "%{count} tokens"
  ja: "%{count} トークン"
settings.history_none:
  en: None
  ja: なし
settings.default:
  en: "%{value} (default)"
  ja: "%{value}（既定）"
settings.document_note:
  en: "Long texts are split between paragraphs into chunks of at most this size and translated in order, each with up to this much of the preceding text and its translation. Larger chunks make loops and skipped passages more likely."
  ja: "長い文章は、段落の切れ目でこの大きさ以下の塊に分けて順に訳します。各塊には、直前の原文と訳文をこの量まで添えます。塊を大きくすると、繰り返しや訳抜けが起きやすくなります。"
settings.theme_system:
  en: System
  ja: システムに合わせる
settings.theme_light:
  en: Light
  ja: ライト
settings.theme_dark:
  en: Dark
  ja: ダーク
settings.ui_scale:
  en: UI size
  ja: 表示の大きさ
settings.ui_scale_note:
  en: "On top of the display scaling of the OS. For a high-DPI display that the desktop does not scale (some Linux desktops)."
  ja: "OS の表示スケールに上乗せします。高解像度のディスプレイを OS が拡大しない場合（一部の Linux デスクトップ）に使ってください。"
settings.double_copy:
  en: Translate when copied twice
  ja: 2 回コピーで翻訳する
settings.double_copy_note:
  en: "Select text in any application and press Ctrl+C twice quickly (⌘C on macOS): this window comes to the front and translates it. Only the clipboard is watched, not the keyboard. To use this with the window closed, also turn on “Keep running when the window is closed”."
  ja: "どのアプリでも、テキストを選んで Ctrl+C（macOS では ⌘C）を素早く 2 回押すと、このウィンドウが前面に出て翻訳します。見るのはクリップボードだけで、キーボードの入力は見ません。ウィンドウを閉じた後も使うには「ウィンドウを閉じても常駐する」もオンにしてください。"
settings.double_copy_failed:
  en: "Cannot watch the clipboard: %{message}"
  ja: "クリップボードを監視できません: %{message}"
settings.double_copy_no_x11:
  en: "Not available here: watching the clipboard needs X11 (in a Wayland session, Xwayland), and DISPLAY is not set."
  ja: "この環境では使えません。クリップボードを見るには X11（Wayland のセッションでは Xwayland）が必要ですが、DISPLAY が設定されていません。"
settings.resident:
  en: Keep running when the window is closed
  ja: ウィンドウを閉じても常駐する
settings.resident_note_windows:
  en: "The icon in the notification area opens the window again, and its menu quits the app (as Ctrl+Q does). The model is released while the window is closed, and loaded again when it opens."
  ja: "通知領域のアイコンでウィンドウを開き直し、そのメニューでアプリを終了します（Ctrl+Q でも終了します）。ウィンドウを閉じている間はモデルをメモリから外し、開くときに読み込み直します。"
settings.resident_note_macos:
  en: "The app's icon in the Dock opens the window again; ⌘Q quits the app. The model is released while the window is closed, and loaded again when it opens."
  ja: "Dock のアイコンでウィンドウを開き直します。⌘Q でアプリを終了します。ウィンドウを閉じている間はモデルをメモリから外し、開くときに読み込み直します。"
settings.resident_note_linux:
  en: "Starting the app again opens the window; Ctrl+Q quits the app. The model is released while the window is closed, and loaded again when it opens."
  ja: "アプリをもう一度起動するとウィンドウが開きます。Ctrl+Q でアプリを終了します。ウィンドウを閉じている間はモデルをメモリから外し、開くときに読み込み直します。"
tray.open:
  en: Open PLaMo Translate
  ja: PLaMo Translate を開く
tray.quit:
  en: Quit
  ja: 終了

models.quality_legend:
  en: "Quality (higher is better): Ja↔En = PFTB, multilingual = FLORES+ chrF++ (Ja↔14 languages). In parentheses: difference from the unquantized model."
  ja: "品質（高いほど良い）: 日英 = PFTB、多言語 = FLORES+ chrF++（日本語↔14 言語）。カッコ内は量子化なし（BF16）との差。"
models.quality_source:
  en: Source (model card)
  ja: 出典（モデルカード）
models.quality_unknown:
  en: No published figures
  ja: 公表値なし
models.metric_ja:
  en: Ja↔En
  ja: 日英
models.metric_multi:
  en: Multilingual
  ja: 多言語
models.bf16_reference:
  en: "Unquantized: Ja↔En %{ja} / multilingual %{multi}"
  ja: "量子化なし: 日英 %{ja} / 多言語 %{multi}"
models.size_08b:
  en: Smallest and fastest. Runs well even without a GPU; quality is a step below 2B.
  ja: 最小・最速。GPU なしでも軽快に動きます。品質は 2B より一段下です。
models.size_2b:
  en: Balanced speed and quality. Practical on a CPU, very fast on a GPU.
  ja: 速度と品質のバランス型。CPU でも実用的で、GPU ならとても高速です。
models.size_8b:
  en: High quality. A GPU with 8 GB or more is recommended.
  ja: 高品質。8 GB 以上の GPU を推奨します。
models.size_31b:
  en: Best quality. Needs about 20 GB of memory at Q4_K_M; slow without a large GPU.
  ja: 最高品質。Q4_K_M で約 20 GB のメモリが必要で、大容量の GPU がないと低速です。
models.size_other:
  en: Newly published size.
  ja: 新しく公開されたサイズです。
models.quant_q4km:
  en: Recommended. Practically the same quality as unquantized.
  ja: おすすめ。量子化なしとほぼ同等の品質です。
models.quant_q40:
  en: Slightly smaller; tuned for phones. Multilingual quality drops a little.
  ja: やや小さく、スマートフォン向けに最適化。多言語の品質が少し下がります。
models.quant_q3km:
  en: Smaller, with a small quality loss.
  ja: 小さめ。品質はわずかに下がります。
models.quant_q2k:
  en: Smallest, with a noticeable quality loss.
  ja: 最小。品質の低下がはっきり出ます。
models.quant_q80:
  en: Larger, nearly lossless.
  ja: 大きめ。ほぼ劣化なし。
models.catalog_checking:
  en: Checking Hugging Face for new models…
  ja: Hugging Face で新しいモデルを確認中…
models.catalog_up_to_date:
  en: The list is up to date.
  ja: 一覧は最新です。
models.catalog_updated:
  en: "Found %{count} new or updated files."
  ja: "新しいファイルを %{count} 件見つけました。"
models.catalog_failed:
  en: "Could not check for new models (%{message}). Showing the known list."
  ja: "新しいモデルを確認できませんでした（%{message}）。既知の一覧を表示しています。"
models.catalog_refresh:
  en: Check again
  ja: 再確認
