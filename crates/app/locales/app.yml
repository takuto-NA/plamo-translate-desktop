license.title:
  en: PLaMo Community License
  ja: PLaMo コミュニティライセンス
license.body:
  en: "The translation models are provided by Preferred Networks, Inc. under the PLaMo Community License. Please read it and agree before downloading a model."
  ja: "翻訳モデルは、Preferred Networks, Inc. により PLaMo コミュニティライセンスで提供されています。モデルをダウンロードする前に、内容を確認して同意してください。"
license.point_personal:
  en: "• Personal and non-commercial use is free."
  ja: "• 個人・非商用での利用は無料です。"
license.point_commercial:
  en: "• Commercial use (including use within an organization) requires prior registration, or a separate agreement if annual revenue exceeds ¥1 billion."
  ja: "• 商用利用（組織内での利用を含む）には事前登録が必要です。年間売上が 10 億円を超える場合は別途契約が必要です。"
license.point_output:
  en: "• When publishing translations, indicate that they were produced by PLaMo."
  ja: "• 翻訳結果を公開する際は、PLaMo による出力であることを明示してください。"
license.accept:
  en: I agree
  ja: 同意する
license.later:
  en: Later
  ja: 後で

