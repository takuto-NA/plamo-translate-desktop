[package]
name = "plamo-translate-desktop"
description = "Desktop app that translates locally with PLaMo 3 Translate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# `scripts/rocm.sh cargo run -p plamo-translate-desktop --release --features rocm`. Packages
# enable `engine/vulkan` and `engine/dynamic-backends` directly.
rocm = ["engine/rocm"]

[dependencies]
appdata.workspace = true
desktop.workspace = true
engine.workspace = true
update.workspace = true
gpui-kit = "=0.9.0"
async-channel = "2"
rust-i18n = "4.2"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
winresource = "0.1"
