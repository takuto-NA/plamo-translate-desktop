name: Release

# Builds the Windows, Linux and macOS packages with the size-optimized `dist` profile, the Windows
# package for Intel NPUs, and the browser extension alone (which translates in the browser).
# - Pushing a tag `vX.Y.Z` (matching the workspace version) publishes a GitHub release.
# - Running the workflow manually builds the packages as artifacts only, from any branch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Vulkan and dynamically loaded ggml backends.
  DIST_FEATURES: engine/vulkan,engine/dynamic-backends
  # The Rust version the packages are built with: that of rust-toolchain.toml, which says why.
  RUST_VERSION: "1.99.1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Determine the version
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$crate" ]]; then
              echo "::error::tag v$tag does not match the workspace version $crate"
              exit 1
            fi
            # The release notes are this version's section of the changelog, which a release
            # dates (an "Unreleased" one would be published as it is).
            if ! grep -q "^## \[$tag\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\$" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no dated section for $tag"
              exit 1
            fi
            version="$tag"
          else
            version="$crate-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  extension:
    name: Browser extension package
    needs: version
    runs-on: ubuntu-24.04
    env:
      PACKAGE: plamo-translate-desktop-${{ needs.version.outputs.version }}-browser-extension
    steps:
      - uses: actions/checkout@v7

      # The unzipped folder is the extension itself (as Load unpacked takes it), with the licenses
      # and the in-browser engine's notices; the README's section on it is online.
      - name: Package
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          manifest=$(jq -r .version extension/manifest.json)
          if [[ "$manifest" != "$crate" ]]; then
            echo "::error::extension/manifest.json has version $manifest, the workspace $crate"
            exit 1
          fi
          dist="dist/$PACKAGE"
          mkdir -p dist
          cp -r extension "$dist"
          scripts/notices.sh extension "$dist/THIRD-PARTY-NOTICES.txt"
          cp LICENSE-MIT LICENSE-APACHE "$dist/"
          # Tells the panel that it is the extension's own package, which asks GitHub for new
          # versions (the app's copy is updated with the app).
          python3 scripts/package-marker.py "$dist" browser-extension --no-entries
          find "$dist" -maxdepth 1 | sort
          (cd dist && zip -qr "../$PACKAGE.zip" "$PACKAGE")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip

  macos:
    name: macOS package
    needs: version
    runs-on: macos-15
    env:
      PACKAGE: plamo-translate-desktop-${{ needs.version.outputs.version }}-macos-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # The app bundle in a disk image, signed ad hoc and not notarized (the README says how to
      # open it), named with the version job's version. The script runs its smoke tests.
      - name: Package
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.dmg
          if-no-files-found: error

  linux:
    name: Linux package
    needs: version
    runs-on: ubuntu-24.04
    env:
      PACKAGE: plamo-translate-desktop-${{ needs.version.outputs.version }}-linux-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libvulkan-dev glslc spirv-headers

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # The cache key includes the rustc version, so a new stable release starts a new cache.
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --workspace --profile dist --bins --examples --locked --features "$DIST_FEATURES"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party notices
        run: scripts/notices.sh linux THIRD-PARTY-NOTICES.txt

      - name: Package
        run: |
          set -euo pipefail
          dist="dist/$PACKAGE"
          mkdir -p "$dist"
          cp target/dist/plamo-translate-desktop target/dist/plamo-translate-host "$dist/"
          cp -r extension "$dist/browser-extension"
          # Newest llama-cpp-sys-2 build output with backend modules.
          backends=$(ls -td target/dist/build/llama-cpp-sys-2-*/out/backends | head -n1)
          test -n "$backends" || { echo "llama-cpp-sys-2 backend modules not found"; exit 1; }
          out=${backends%/backends}
          # The executables need these by SONAME and find them through RUNPATH=$ORIGIN. The
          # build tree holds them as symlinks, so copy the files they point to.
          for lib in libllama.so.0 libggml.so.0 libggml-base.so.0; do
            src=$(find "$out" -name "$lib" | awk '{ print length, $0 }' | sort -n | head -n1 | cut -d' ' -f2-)
            test -n "$src" || { echo "$lib not found"; exit 1; }
            cp -L "$src" "$dist/$lib"
          done
          # Backend modules: Vulkan, plus the same CPU variants as on Windows (see below).
          cp -L "$out/backends/libggml-vulkan.so" "$dist/"
          for variant in x64 haswell skylakex icelake alderlake; do
            cp -L "$out/backends/libggml-cpu-$variant.so" "$dist/"
          done
          cp README.md README.ja.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt "$dist/"
          # A desktop entry and its icon; README.md explains how to install them.
          cp assets/plamo-translate-desktop.desktop "$dist/"
          cp assets/icon/icon-256.png "$dist/plamo-translate-desktop.png"
          ls -l "$dist"
          # Smoke test with the package's own libraries: the CLI must load llama.cpp and list
          # at least the CPU. The CLI is a development tool and is not shipped.
          cp target/dist/examples/translate "$dist/"
          env -u LD_LIBRARY_PATH "$dist/translate" --list-devices
          rm "$dist/translate"
          env -u LD_LIBRARY_PATH "$dist/plamo-translate-host" --check
          # What the app needs to update itself, once the folder is complete.
          python3 scripts/package-marker.py "$dist" linux-x86_64
          tar -C dist -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz

  windows:
    name: Windows package
    needs: version
    runs-on: windows-2025
    env:
      PACKAGE: plamo-translate-desktop-${{ needs.version.outputs.version }}-windows-x86_64
      # The same plus the OpenVINO backend, for Intel NPUs.
      NPU_PACKAGE: plamo-translate-desktop-${{ needs.version.outputs.version }}-windows-x86_64-intel-npu
      VULKAN_VERSION: 1.4.363.1
      # The version llama.cpp's OpenVINO backend is validated with (docs/backend/OPENVINO.md).
      OPENVINO_VERSION: 2026.4.1
      OPENVINO_BUILD: 22982.07f9c262b05
      OPENCL_SDK_VERSION: v2026.05.29
      # A short target directory keeps llama.cpp's nested CMake build paths under MAX_PATH.
      CARGO_TARGET_DIR: D:\t
    steps:
      - uses: actions/checkout@v7

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Start-Process -FilePath $installer -Wait -NoNewWindow `
            -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "Vulkan SDK was not installed to $sdk" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # For the Intel NPU package. The OpenVINO backend builds against the OpenVINO archive's
      # headers and import libraries and the OpenCL SDK's. The package ships the OpenVINO DLLs
      # of the same build from the `openvino` wheel on PyPI, which is under Apache-2.0 (the
      # archive's runtime is under Intel's distribution license), and the SDK's OpenCL loader.
      - uses: actions/cache@v6
        id: openvino-cache
        with:
          path: D:\openvino
          key: openvino-${{ env.OPENVINO_VERSION }}-${{ env.OPENVINO_BUILD }}-${{ env.OPENCL_SDK_VERSION }}

      - name: Install OpenVINO and OpenCL
        if: steps.openvino-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dir = 'D:\openvino'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $name = "openvino_toolkit_windows_$env:OPENVINO_VERSION.$($env:OPENVINO_BUILD)_x86_64"
          curl.exe -fsSL -o "$dir\toolkit.zip" "https://storage.openvinotoolkit.org/repositories/openvino/packages/$env:OPENVINO_VERSION/windows/$name.zip"
          Expand-Archive "$dir\toolkit.zip" $dir
          Remove-Item "$dir\toolkit.zip"
          $toolkit = Get-ChildItem $dir -Directory -Filter 'openvino_toolkit_*' | Select-Object -First 1
          Rename-Item $toolkit.FullName 'toolkit'
          if (-not (Test-Path "$dir\toolkit\runtime\cmake\OpenVINOConfig.cmake")) { throw 'OpenVINO toolkit not found' }

          python -m pip download "openvino==$env:OPENVINO_VERSION" --no-deps --only-binary=:all: `
            --platform win_amd64 --python-version 3.12 -d "$dir\download"
          $wheel = Get-ChildItem "$dir\download\openvino-*.whl" | Select-Object -First 1
          $build = $env:OPENVINO_BUILD.Split('.')[0]
          if ($wheel.Name -notlike "*-$build-*") { throw "$($wheel.Name) is not build $build" }
          Copy-Item $wheel.FullName "$dir\wheel.zip"
          Expand-Archive "$dir\wheel.zip" "$dir\wheel"
          Remove-Item "$dir\wheel.zip", "$dir\download" -Recurse

          $sdk = "OpenCL-SDK-$env:OPENCL_SDK_VERSION-Win-x64"
          curl.exe -fsSL -o "$dir\opencl.zip" "https://github.com/KhronosGroup/OpenCL-SDK/releases/download/$env:OPENCL_SDK_VERSION/$sdk.zip"
          Expand-Archive "$dir\opencl.zip" $dir
          Remove-Item "$dir\opencl.zip"
          Rename-Item "$dir\$sdk" 'opencl'
          Get-ChildItem $dir | Format-Table Name

      - name: Enable the OpenVINO backend
        shell: pwsh
        run: |
          # llama-cpp-sys-2 passes GGML_* and CMAKE_* variables to CMake.
          "GGML_OPENVINO=ON" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=D:/openvino/toolkit/runtime/cmake;D:/openvino/opencl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
        id: toolchain

      # The llama-cpp-rs git dependency checks out llama.cpp as a submodule, which contains
      # paths over 230 characters. A short CARGO_HOME keeps them under MAX_PATH.
      - name: Shorten Cargo paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          "CARGO_HOME=D:\c" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/cache@v6
        with:
          path: |
            D:\c\registry\index
            D:\c\registry\cache
            D:\c\git\db
            D:\t
          # Keyed on the rustc version: build outputs from an older compiler are not reusable.
          key: windows-dist-${{ steps.toolchain.outputs.cachekey }}-${{ env.VULKAN_VERSION }}-ov${{ env.OPENVINO_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-dist-${{ steps.toolchain.outputs.cachekey }}-${{ env.VULKAN_VERSION }}-ov${{ env.OPENVINO_VERSION }}-
            windows-dist-${{ steps.toolchain.outputs.cachekey }}-${{ env.VULKAN_VERSION }}-

      # llama.cpp builds with Ninja and the MSVC environment: with the Visual Studio 2026
      # generator, MSBuild runs the install step of ggml-vulkan's vulkan-shaders-gen external
      # project before its build step on a fresh build (MSB8066).
      # The environment is vcvars64.bat's (compiler, linker and SDK in PATH, INCLUDE and LIB):
      # the variables it changes are passed to the later steps. ilammy/msvc-dev-cmd did this, but
      # it is no longer updated and runs on the deprecated Node.js 20.
      - name: Use the MSVC developer environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ x64 tools" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $after = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $after) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -cne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - name: Use Ninja for CMake
        shell: pwsh
        run: |
          # From the previous step.
          (Get-Command cl).Source
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install ninja }
          ninja --version
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # llama-cpp-sys-2 reruns its build when a GGML_* variable it saw changes, not when one
      # appears, so a cache from before GGML_OPENVINO keeps a build without the backend.
      - name: Rebuild a cached llama.cpp that lacks the OpenVINO backend
        shell: pwsh
        run: |
          $module = Get-ChildItem "$env:CARGO_TARGET_DIR\dist\build\llama-cpp-sys-2-*\out\backends\ggml-openvino.dll" -ErrorAction SilentlyContinue
          if (-not $module) { cargo clean -p llama-cpp-sys-2 --profile dist }

      - run: cargo build --workspace --profile dist --bins --examples --locked --features $env:DIST_FEATURES

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party notices
        shell: bash
        run: scripts/notices.sh windows THIRD-PARTY-NOTICES.txt

      - name: Package
        shell: pwsh
        run: |
          $profile_dir = Join-Path $env:CARGO_TARGET_DIR 'dist'
          $dist = "dist\$env:PACKAGE"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$profile_dir\plamo-translate-desktop.exe", "$profile_dir\plamo-translate-host.exe" $dist
          Copy-Item -Recurse extension "$dist\browser-extension"
          # Output of the newest llama-cpp-sys-2 build: llama.cpp DLLs and ggml backend modules.
          $out = Get-ChildItem "$profile_dir\build\llama-cpp-sys-2-*\out" -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'backends') } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $out) { throw 'llama-cpp-sys-2 build output not found' }
          # The executables import these three; pick the copy with the shortest path (the
          # install tree rather than the CMake build tree).
          foreach ($dll in 'llama.dll', 'ggml.dll', 'ggml-base.dll') {
            $found = Get-ChildItem $out.FullName -Recurse -Filter $dll |
              Sort-Object { $_.FullName.Length } | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName $dist }
          }
          # Backend modules: Vulkan, plus a subset of the CPU variants. ggml loads the best one the
          # CPU supports. Measured on a Ryzen 9 9950X (2B Q4_K_M): AVX2 and AVX-512 generate at the
          # same speed (memory-bound) and AVX-512 processes prompts ~25% faster; x64 is the slow
          # last resort. sse42/sandybridge (pre-AVX2 CPUs) and cannonlake/cascadelake (covered by
          # skylakex/icelake) are left out.
          Copy-Item "$($out.FullName)\backends\ggml-vulkan.dll" $dist
          foreach ($variant in 'x64', 'haswell', 'skylakex', 'icelake', 'alderlake') {
            Copy-Item "$($out.FullName)\backends\ggml-cpu-$variant.dll" $dist
          }
          # The Visual C++ runtime and OpenMP DLLs that the exe and the llama.cpp DLLs import, from
          # the toolset that built them, so the app runs without the Redistributable installed.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d' -and (Test-Path "$($_.FullName)\x64") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $redist) { throw 'Visual C++ redistributable files not found' }
          $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          $omp = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter 'Microsoft.VC*.OpenMP' | Select-Object -First 1
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            Copy-Item "$($crt.FullName)\$dll" $dist
          }
          Copy-Item "$($omp.FullName)\vcomp140.dll" $dist
          foreach ($dll in 'llama.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-vulkan.dll',
                           'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'vcomp140.dll') {
            if (-not (Test-Path (Join-Path $dist $dll))) { throw "$dll is missing from the package" }
          }
          Copy-Item README.md, README.ja.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.txt $dist
          Get-ChildItem $dist | Format-Table Name, Length
          # Smoke test with the package's own DLLs: the CLI must load llama.cpp and list at least
          # the CPU. The CLI is a development tool and is not shipped.
          Copy-Item "$profile_dir\examples\translate.exe" $dist
          & "$dist\translate.exe" --list-devices
          if ($LASTEXITCODE -ne 0) { throw "translate.exe failed with exit code $LASTEXITCODE" }
          & "$dist\plamo-translate-host.exe" --check
          if ($LASTEXITCODE -ne 0) { throw "plamo-translate-host.exe failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force cli | Out-Null
          Move-Item "$dist\translate.exe" cli
          # What the app needs to update itself, once the folder is complete.
          python scripts\package-marker.py $dist windows-x86_64
          if ($LASTEXITCODE -ne 0) { throw "package-marker.py failed" }
          Compress-Archive -Path $dist -DestinationPath "$env:PACKAGE.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip

      # The package above plus the OpenVINO backend and the OpenVINO NPU runtime. Only the NPU
      # plugin is shipped, so OpenVINO computes on the NPU (see `Runtime::devices`).
      - name: Package for Intel NPUs
        shell: pwsh
        run: |
          $profile_dir = Join-Path $env:CARGO_TARGET_DIR 'dist'
          $npu = "dist\$env:NPU_PACKAGE"
          Copy-Item -Recurse "dist\$env:PACKAGE" $npu
          $out = Get-ChildItem "$profile_dir\build\llama-cpp-sys-2-*\out" -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'backends') } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item "$($out.FullName)\backends\ggml-openvino.dll" $npu
          $libs = 'D:\openvino\wheel\openvino\libs'
          foreach ($dll in 'openvino.dll', 'openvino_intel_npu_plugin.dll', 'openvino_intel_npu_compiler.dll',
                           'openvino_intel_npu_compiler_loader.dll', 'openvino_intel_npu_vm_runtime.dll',
                           'tbb12.dll', 'tbbbind_2_5.dll', 'tbbmalloc.dll') {
            Copy-Item "$libs\$dll" $npu
          }
          Copy-Item 'D:\openvino\opencl\bin\OpenCL.dll' $npu
          # Their licenses after the package's own notices.
          $notices = "$npu\THIRD-PARTY-NOTICES.txt"
          $licensing = Get-ChildItem 'D:\openvino\wheel\openvino-*.dist-info\licenses' -Directory | Select-Object -First 1
          Add-Content $notices '', (Get-Content licenses\intel-npu.txt -Raw)
          foreach ($file in 'LICENSE', 'licensing\runtime-third-party-programs.txt', 'licensing\onetbb_third-party-programs.txt') {
            Add-Content $notices '', (Get-Content (Join-Path $licensing.FullName $file) -Raw)
          }
          Get-ChildItem $npu | Format-Table Name, Length
          # Smoke test: the OpenVINO backend and the DLLs it needs load. The runner has no NPU, so
          # no OpenVINO device is listed.
          Copy-Item "$profile_dir\examples\translate.exe" $npu
          $log = & "$npu\translate.exe" --list-devices --verbose 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Output $log; throw "translate.exe failed with exit code $LASTEXITCODE" }
          if ($log -notmatch 'loaded OPENVINO backend') { Write-Output $log; throw 'the OpenVINO backend did not load' }
          Remove-Item "$npu\translate.exe"
          & "$npu\plamo-translate-host.exe" --check
          if ($LASTEXITCODE -ne 0) { throw "plamo-translate-host.exe failed with exit code $LASTEXITCODE" }
          # Its own kind and entries, in place of the copied package's.
          python scripts\package-marker.py $npu windows-x86_64-intel-npu
          if ($LASTEXITCODE -ne 0) { throw "package-marker.py failed" }
          Compress-Archive -Path $npu -DestinationPath "$env:NPU_PACKAGE.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NPU_PACKAGE }}
          path: ${{ env.NPU_PACKAGE }}.zip

      # For testing the engine on Windows GPUs: place translate.exe next to the package's DLLs.
      - name: Upload the translate CLI (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}-cli
          path: cli/translate.exe

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, extension, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd packages && sha256sum -- * > SHA256SUMS.txt)
          ls -l packages
          cat packages/SHA256SUMS.txt
          # This version's section of the changelog, before GitHub's generated notes.
          scripts/changelog.sh "$VERSION" > notes.md
          cat notes.md
          gh release create "v$VERSION" packages/* \
            --title "PLaMo Translate Desktop $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
