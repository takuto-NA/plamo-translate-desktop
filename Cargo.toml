[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT OR Apache-2.0"
authors = ["Hideyuki Tanaka"]
repository = "https://github.com/tanakh/plamo-translate-desktop"

[workspace.dependencies]
pfml = { path = "crates/pfml" }
engine = { path = "crates/engine" }
appdata = { path = "crates/appdata" }
update = { path = "crates/update" }
desktop = { path = "crates/desktop" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned to llama-cpp-rs main: the latest crates.io release (0.1.161) vendors llama.cpp 0.6.0,
# which lacks the `plamo3` tokenizer used by the PLaMo 3 Translate GGUF files.
# Switch back to a crates.io release once one ships llama.cpp >= 0.8.0.
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da1c6a6ee37f507031f116ce4a09b28594", default-features = false }
llama-cpp-sys-2 = { git = "https://github.com/utilityai/llama-cpp-rs", rev = "0364f5da1c6a6ee37f507031f116ce4a09b28594", default-features = false }

# Size-optimized release for distribution: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
