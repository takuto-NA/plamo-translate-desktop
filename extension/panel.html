<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLaMo Translate</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" width="20" height="20" alt="" />
      <h1>PLaMo Translate</h1>
      <button id="release" class="small" data-i18n="release" data-i18n-title="releaseTitle"></button>
    </header>
    <div id="status" class="status"></div>
    <!-- A newer version of the extension: on disk (the app updated itself), or on GitHub. -->
    <div id="updateNotice" class="notice update-notice" hidden>
      <span id="updateText"></span>
      <button id="updateAction" class="small"></button>
    </div>
    <!-- At the top: the controls below it belong to the text box. -->
    <button id="translatePage" class="page-button" data-i18n="translatePage" data-i18n-title="translatePageTitle"></button>
    <!-- Under the page button, whose failures it explains, and in view whatever the panel shows. -->
    <div id="notice" class="notice" hidden>
      <span id="noticeText"></span>
      <button id="noticeAction" class="small" hidden></button>
    </div>

    <details id="settings">
      <summary data-i18n="settings"></summary>
      <label><span data-i18n="engine"></span><select id="engine"></select></label>
      <label><span data-i18n="model"></span><select id="model"></select></label>
      <!-- The in-browser engine's models: download, progress, delete. -->
      <div id="browserModels" class="browser-models" hidden>
        <div id="modelRows"></div>
        <div id="license" class="license" hidden>
          <span data-i18n="licenseNotice"></span>
          <a id="licenseLink" target="_blank" rel="noopener" data-i18n="licenseRead"></a>
          <button id="licenseAccept" class="small" data-i18n="licenseAccept"></button>
        </div>
      </div>
      <label><span data-i18n="device"></span><select id="device"></select></label>
      <!-- The in-browser engine measures its devices again; Automatic then uses the faster. -->
      <div id="measureRow" class="measure-row" hidden>
        <span id="measured"></span>
        <button id="measure" class="small" data-i18n="measure" data-i18n-title="measureTitle"></button>
      </div>
      <label id="threadsRow" hidden><span data-i18n="threads"></span><select id="threads"></select></label>
      <label><span data-i18n="pageMode"></span><select id="pageMode"></select></label>
      <label class="check"><input type="checkbox" id="pageMarks" /><span data-i18n="pageMarks"></span></label>
      <label class="check"><input type="checkbox" id="pageNearby" /><span data-i18n="pageNearby"></span></label>
      <p class="hint check-hint" data-i18n="pageNearbyHint"></p>
      <!-- Translations kept to be used again (cache.js): the switch, how many, and a way to drop them. -->
      <label class="check"><input type="checkbox" id="keepTranslations" /><span data-i18n="keepTranslations"></span></label>
      <p class="hint check-hint">
        <span data-i18n="keepTranslationsHint"></span>
        <span id="keptCount"></span>
        <button id="clearKept" class="small" data-i18n="clearKept"></button>
      </p>
      <!-- The in-browser engine's batches side by side: faster, with less context. -->
      <div id="parallelRow" hidden>
        <label class="check"><input type="checkbox" id="parallelPages" /><span data-i18n="parallelPages"></span></label>
        <p class="hint check-hint" data-i18n="parallelPagesHint"></p>
      </div>
      <!-- Only the browser sets the keys, on its own page: the panel shows them and links there. -->
      <div class="shortcuts">
        <div class="shortcuts-header">
          <span data-i18n="shortcuts"></span>
          <a id="shortcutsLink" href="#" data-i18n="shortcutsChange" data-i18n-title="shortcutsChangeTitle"></a>
        </div>
        <div id="shortcutRows" class="shortcut-rows"></div>
      </div>
      <label><span data-i18n="uiLanguage"></span><select id="uiLanguage"></select></label>
      <!-- Only in the extension's own package: the app's copy is updated with the app. -->
      <div id="checkUpdatesRow" hidden>
        <label class="check"><input type="checkbox" id="checkUpdates" /><span data-i18n="checkUpdates"></span></label>
        <p class="hint check-hint" data-i18n="checkUpdatesHint"></p>
      </div>
      <!-- In the browser, a link to setting up the app, which the larger models need. -->
      <p class="hint"><span id="settingsHint"></span> <a id="appGuide" href="#" hidden data-i18n="appGuide"></a></p>
      <!-- Back to a first start, for example to see the license notice again. -->
      <p><button id="resetSettings" class="small" data-i18n="resetSettings"></button></p>
    </details>

    <div class="controls">
      <select id="target" aria-label="target"></select>
      <select id="style" aria-label="style"></select>
      <button id="translate" class="primary" data-i18n="translate"></button>
    </div>

    <textarea id="source" rows="6" data-i18n-placeholder="sourcePlaceholder"></textarea>

    <div class="output-header">
      <span id="progress"></span>
      <button id="copy" class="small" data-i18n="copy" disabled></button>
    </div>
    <div id="output" class="output" aria-live="polite"></div>

    <footer data-i18n="builtWith"></footer>
    <script src="i18n.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
